site_name: ArcGIS Pro for wildfire simulation
site_description: Using ArcGIS Pro 3.7.1 for wildfire simulation, in the US and Canada
site_url: https://miflowe.github.io/ArcGisPro-How-to-use/
repo_url: https://github.com/miflowe/ArcGisPro-How-to-use
repo_name: miflowe/ArcGisPro-How-to-use
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys          # renders ++ctrl+s++ as key caps
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

# The page template is authoring guidance, not a page. Its example links are placeholders
# ('path.md', 'url') that will never resolve, so --strict fails if it is part of the build.
exclude_docs: |
  _template.md

nav:
  - Home: index.md

  - Wildfire:
      - wildfire/index.md
      - Maps:
          - Data sources: wildfire/maps/data-sources.md
          - Working with maps: wildfire/maps/working-with-maps.md
      - Python scripts:
          - wildfire/scripts/index.md
